services:
  - type: web
    name: acme-importer-api
    env: python
    rootDir: BE
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn acme_importer.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - fromGroup: acme-importer-shared
      - key: DJANGO_SETTINGS_MODULE
        value: acme_importer.settings
      - key: ALLOWED_HOSTS
        value: acme-importer-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: acme-importer-db
          property: connectionString

databases:
  - name: acme-importer-db
    plan: free
    region: oregon
    databaseName: acme_importer
    user: acme_importer_user

envVarGroups:
  - name: acme-importer-shared
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: CELERY_TASK_EAGER_PROPAGATES
        value: "true"
